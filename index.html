<style>
:root{--bg:#f4f5f8;--surface:#fff;--fg:#1d2330;--muted:#677084;--line:#dfe3ea;--accent:#2f5fd0;--accent-bg:#e6edfb;--ok:#1d7a4a;--sprite:#eceff4;--head:#f0f2f7;--love:#c2416b;--love-bg:#fbe7ef;--like:#1d7a4a;--like-bg:#e3f4ea;--neu:#677084;--neu-bg:#eceff4;--dis:#a8650f;--dis-bg:#fbefd9;--hate:#b3261e;--hate-bg:#fbe4e2;
--sans:"Noto Sans KR",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#14171d;--surface:#1c212a;--fg:#e6e9ef;--muted:#98a1b3;--line:#2c3340;--accent:#7ea2ff;--accent-bg:#232d47;--ok:#6fd49b;--sprite:#2a3140;--head:#232a36;--love:#ff8fb3;--love-bg:#3a2230;--like:#6fd49b;--like-bg:#1f3328;--neu:#98a1b3;--neu-bg:#2a3140;--dis:#f0b45c;--dis-bg:#3a2f1c;--hate:#ff8a80;--hate-bg:#3d2422;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.muted{color:var(--muted)}.sm{font-size:13px}.mono{font-family:var(--mono);font-size:12.5px}
.empty{color:var(--muted);font-size:13px}

/* 상단바 */
.top{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 16px}
.brand{font-weight:700;font-size:17px;color:var(--fg);white-space:nowrap}.brand:hover{text-decoration:none}
.brand i{font-style:normal;color:var(--love)}
.search{position:relative;flex:1;max-width:420px;margin-left:auto}
.search input{width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.sr{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:340px;overflow:auto;display:none;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.sr.on{display:block}
.sr a{display:flex;align-items:center;gap:8px;padding:6px 10px;color:var(--fg);font-size:14px}
.sr a:hover{background:var(--accent-bg);text-decoration:none}
.sr .k{margin-left:auto;font-size:11.5px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.pri:hover{color:#fff;opacity:.9}
.btn.del{color:var(--hate)}.btn:disabled{opacity:.5;cursor:default}
#mb{display:none}
.ebar{position:sticky;top:51px;z-index:25;background:var(--love-bg);border-bottom:1px solid var(--love);padding:7px 16px;display:none;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.ebar.on{display:flex}.ebar b{color:var(--love)}.ebar .sp{flex:1}

/* 레이아웃 */
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);gap:16px;max-width:1200px;margin:16px auto;padding:0 16px}
.side{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 90px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.side h4{margin:10px 8px 4px;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.02em}
.side a{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px;color:var(--fg);font-size:13.5px}
.side a:hover{background:var(--head);text-decoration:none}
.side a[aria-current=page]{background:var(--accent-bg);color:var(--accent);font-weight:700}
.thumb{position:relative;width:28px;height:28px;border-radius:4px;background:var(--sprite);flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ph{font-size:11px;color:var(--muted);text-align:center;line-height:1.3}
.has>.ph{display:none}
.px{image-rendering:pixelated}
.dc{display:contents}
.pslot img.px{object-fit:contain;padding:10% 28%}

/* 문서 */
.art{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px 26px 28px;min-width:0;overflow:hidden}
.art:after{content:"";display:block;clear:both}
.art h1{font-size:27px;line-height:1.3;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--line);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.art h2{font-size:20px;margin:28px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--line);clear:none}
.art h2 .sn{color:var(--accent);margin-right:7px}
.art h3{font-size:15px;margin:18px 0 6px;color:var(--fg)}
.art p{margin:8px 0}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--love-bg);color:var(--love);white-space:nowrap}
.infobox{float:right;width:290px;margin:4px 0 16px 22px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.infobox .ih{background:var(--love);color:#fff;text-align:center;font-weight:700;padding:8px;font-size:16px}
.pslot{position:relative;aspect-ratio:1/1;width:100%;background:var(--sprite);display:flex;align-items:center;justify-content:center}
.pslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sprow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--line);background:var(--head)}
.sprbox{position:relative;width:48px;height:96px;background:var(--sprite);border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center}
.sprbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sprow .cap{font-size:12.5px;color:var(--muted)}
.ebtns{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
.infobox table{width:100%;min-width:0;border-collapse:collapse;font-size:13.5px}
.infobox th{width:84px;background:var(--head);font-weight:500;color:var(--muted);text-align:left;font-size:12.5px;white-space:nowrap}
.infobox th,.infobox td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.toc{display:inline-block;min-width:230px;max-width:100%;border:1px solid var(--line);background:var(--head);border-radius:8px;padding:10px 18px 10px 16px;margin:10px 0 4px}
.toc b{display:block;margin-bottom:4px;font-size:14px}
.toc ol{margin:0;padding-left:20px}.toc li{font-size:14px}.toc a{cursor:pointer}

/* 표·태그 */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:13.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap;background:var(--head)}
td:nth-child(4){white-space:nowrap}
tr:last-child td{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:13px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.row{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.row:first-of-type{border-top:0}
.lv{font-size:12.5px;font-weight:700;padding:3px 0;text-align:center;border-radius:6px}
.lv.love{background:var(--love-bg);color:var(--love)}.lv.like{background:var(--like-bg);color:var(--like)}.lv.neutral{background:var(--neu-bg);color:var(--neu)}.lv.dislike{background:var(--dis-bg);color:var(--dis)}.lv.hate{background:var(--hate-bg);color:var(--hate)}
.items{display:flex;flex-wrap:wrap;gap:5px}
.it{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:2px 8px 2px 3px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.it.cat{padding:2px 9px;background:var(--accent-bg);border-color:transparent;color:var(--accent)}
.it.plain{padding:2px 9px}
.it img{width:24px;height:24px;image-rendering:pixelated;background:var(--sprite);border-radius:3px}
.it.sds{border-color:var(--love)}
.note{color:var(--muted);font-size:13px;margin:8px 0 0;padding-left:18px}
.step{display:flex;gap:10px;font-size:13px}.step b{font-family:var(--mono);font-weight:500;color:var(--muted);min-width:46px}
details{border-top:1px solid var(--line);padding:6px 0}details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:500}
.code{font-family:var(--mono);font-size:12.5px;background:var(--accent-bg);color:var(--accent);border:0;border-radius:4px;padding:3px 7px;cursor:pointer;text-align:left;word-break:break-all}
.code.done{color:var(--ok)}
.spr{display:block;width:32px;height:32px;image-rendering:pixelated;background:var(--sprite);border-radius:4px}

/* 대문 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px;margin:10px 0}
.card{display:block;color:var(--fg);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.card:hover{border-color:var(--accent);text-decoration:none}
.card .pslot{border-bottom:1px solid var(--line)}
.card .nm{padding:6px 8px 7px;font-size:14px;font-weight:500;line-height:1.3}.card .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.bd{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.bd>div{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)}
.bd h3{margin:0 0 4px}.bd div div{font-size:13.5px}

/* 편집 */
.ed{width:100%;min-height:96px;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);resize:vertical}
.edt{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:700;font-size:16px}
.esec{border:1px dashed var(--love);border-radius:8px;padding:10px;margin:12px 0}
.esec .tools{display:flex;justify-content:flex-end;margin-top:6px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);max-width:480px;width:calc(100% - 32px);padding:18px 20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog label{display:block;margin:10px 0 3px;font-size:13px;font-weight:500}
dialog input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
dialog .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.foot{max-width:1200px;margin:0 auto 30px;padding:0 16px;color:var(--muted);font-size:12.5px;text-align:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13.5px;z-index:60;display:none;max-width:90%}

@media(max-width:860px){
 .layout{grid-template-columns:1fr}
 .side{position:static;max-height:none;display:none}.side.open{display:block}
 #mb{display:inline-block}
 .art{padding:16px 16px 22px}
 .infobox{float:none;width:100%;max-width:280px;margin:6px auto 16px}
 .search{max-width:none}.brand span{display:none}
 .ebar{top:51px}
}
@media(max-width:560px){.row{grid-template-columns:1fr}.lv{width:64px}}
</style>
</head>

 <div class="ft"><button class="btn" id="g-x">닫기</button><button class="btn pri" id="g-ok">저장</button></div>
</dialog>

let U={npcs:{},imgs:{portrait:{},sprite:{}}};   // 아직 GitHub에 안 올린 임시 편집분
let BASE={npcs:{},v:{portrait:{},sprite:{}}};   // wiki-data.json (저장된 텍스트 편집분)
const DIR={portrait:'portraits',sprite:'sprites'};
function imgSrc(kind,key){
 const p=U.imgs[kind][key];if(p)return p;
 const v=BASE.v&&BASE.v[kind]&&BASE.v[kind][key];
 return `${DIR[kind]}/${encodeURIComponent(key)}.png`+(v?`?v=${v}`:'');
}
/* 이미지가 로드되면 placeholder 숨김. 스프라이트 시트(가로 64px)면 첫 칸(16x32)만 잘라 씀 */
function spr(im){
 if(im.parentNode)im.parentNode.classList.add('has');
 if(im.dataset.k==='sprite'&&!im.dataset.done&&im.naturalWidth===64&&im.naturalHeight>=32){
  im.dataset.done=1;const c=document.createElement('canvas');c.width=16;c.height=32;
  const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(im,0,0,16,32,0,0,16,32);im.src=c.toDataURL('image/png');
 }
}
function av(im){ // 1순위 이미지가 없으면 2순위로, 둘 다 없으면 제거
 const a=im.dataset.alt;
 if(a){im.dataset.alt='';im.dataset.k=im.dataset.k2;im.classList.toggle('px',im.dataset.k2==='sprite');im.src=a}
 else{im.remove()}
}
function avHTML(key,first,cls){
 const second=first==='sprite'?'portrait':'sprite';
 const n=NPC[key];
 return `<span class="${cls}"><b class="ph">${esc((n?n.ko:key).slice(0,1))}</b><img src="${esc(imgSrc(first,key))}" data-k="${first}" data-k2="${second}" data-alt="${esc(imgSrc(second,key))}" class="${first==='sprite'?'px':''}" alt="" loading="lazy" onload="spr(this)" onerror="av(this)"></span>`;
}

/* ---------- 임시 저장 (IndexedDB) ---------- */
const idb={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('sds-wiki',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
 get(k){return new Promise(res=>{if(!this.db)return res(null);try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}})},
 set(k,v){return new Promise(res=>{if(!this.db)return res();try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>res()}catch(e){res()}})}};
let tmr;const saveDraft=()=>{clearTimeout(tmr);tmr=setTimeout(()=>idb.set('draft',U),250);ebar()};

const getF=(k,f)=>{const d=U.npcs[k];if(d&&d[f]!==undefined)return d[f];const b=BASE.npcs[k];return b?b[f]:undefined};

}

/* ---------- 간단 위키 문법 ---------- */
function wk(s){
 return esc(s).split(/\n{2,}/).filter(p=>p.trim()).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\[\[(.+?)\]\]/g,(m,t)=>{const n=G.npcs.find(x=>x.ko===t||x.key===t);return n?`<a href="#/npc/${encodeURIComponent(n.key)}">${t}</a>`:t});
}

let upKind='',upKey='';
const loadImg=src=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});
$('fi').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f||!upKey)return;
 try{
  const u=URL.createObjectURL(f),im=await loadImg(u),c=document.createElement('canvas'),x=c.getContext('2d');
  const w=im.naturalWidth,h=im.naturalHeight;
  if(upKind==='portrait'){ // 가운데를 정사각형으로 잘라 최대 512px
   const s=Math.min(w,h),o=Math.min(s,512);c.width=c.height=o;x.drawImage(im,(w-s)/2,(h-s)/2,s,s,0,0,o,o);
   if(w!==h)toast('정사각형이 아니라서 가운데를 잘라서 넣었어요.');
  }else{ // 스프라이트 시트면 첫 칸(16x32)만
   let sw=w,sh=h;if(w===64&&h>=32){sw=16;sh=32}
   c.width=sw;c.height=sh;x.imageSmoothingEnabled=false;x.drawImage(im,0,0,sw,sh,0,0,sw,sh);
  }
  URL.revokeObjectURL(u);
  U.imgs[upKind][upKey]=c.toDataURL('image/png');saveDraft();draw();
 }catch(err){toast('이미지를 읽지 못했어요.')}
});

/* GitHub 저장 */
const GH=()=>{try{return JSON.parse(localStorage.getItem('sds-gh')||'{}')}catch(e){return {}}};
const b64txt=s=>btoa(unescape(encodeURIComponent(s)));
async function ghPut(path,b64,msg){
 const c=GH(),full=(c.prefix?c.prefix.replace(/^\/+|\/+$/g,'')+'/':'')+path;
 const url=`https://api.github.com/repos/${c.repo}/contents/${full.split('/').map(encodeURIComponent).join('/')}`;
 const hd={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 let sha;const g=await fetch(url+(c.branch?`?ref=${encodeURIComponent(c.branch)}`:''),{headers:hd});
 if(g.ok)sha=(await g.json()).sha;else if(g.status!==404)throw new Error('확인 실패 '+g.status);
 const r=await fetch(url,{method:'PUT',headers:{...hd,'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:b64,...(sha?{sha}:{}),...(c.branch?{branch:c.branch}:{})})});
 if(!r.ok)throw new Error(`저장 실패 ${r.status} ${(await r.text()).slice(0,100)}`);
}
function effNpcs(){const o={};new Set([...Object.keys(BASE.npcs),...Object.keys(U.npcs)]).forEach(k=>{const v={intro:getF(k,'intro')||'',sections:getF(k,'sections')||[]};if(v.intro.trim()||v.sections.length)o[k]=v});return o}
async function saveGH(){
 const c=GH();if(!c.repo||!c.token){$('dlg').showModal();toast('먼저 저장소와 토큰을 설정해 주세요.');return}
 const btn=$('b-gh');btn.disabled=true;const v=JSON.parse(JSON.stringify(BASE.v));
 try{
  for(const kind of ['portrait','sprite'])for(const k of Object.keys(U.imgs[kind])){
   btn.textContent=`${NPC[k].ko} ${kind==='portrait'?'초상화':'스프라이트'} 올리는 중…`;
   await ghPut(`${DIR[kind]}/${k}.png`,U.imgs[kind][k].split(',')[1],`${NPC[k].ko} ${kind==='portrait'?'초상화':'스프라이트'} 업데이트`);
   v[kind][k]=Date.now();
  }
  btn.textContent='문서 저장 중…';
  const data={npcs:effNpcs(),v};
  await ghPut('wiki-data.json',b64txt(JSON.stringify(data,null,1)),'위키 문서 업데이트');
  // 성공: 올린 이미지는 파일 주소로 바꾸고 임시 저장분 비움
  U={npcs:{},imgs:{portrait:{},sprite:{}}};BASE={npcs:data.npcs,v};
  await idb.set('draft',U);toast('저장했어요. 사이트에 반영되기까지 1~2분 걸릴 수 있어요.',4500);
 }catch(err){toast(String(err.message||err),6000)}
 draw();
}
function exportJSON(){
 const data={npcs:effNpcs(),v:BASE.v,imgs:U.imgs};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='sds-wiki-backup.json';a.click();
}
$('imp').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());
  U.npcs=j.npcs||{};U.imgs={portrait:{...(j.imgs&&j.imgs.portrait)},sprite:{...(j.imgs&&j.imgs.sprite)}};saveDraft();draw();toast('가져왔어요. GitHub에 저장하면 반영돼요.');
 }catch(err){toast('올바른 백업 파일이 아니에요.')}
});

/* ---------- 이벤트 ---------- */
document.addEventListener('click',e=>{
 if(!e.target.closest('.search'))$('sr').classList.remove('on');
 const t=e.target.closest('[data-go],[data-up],[data-addsec],[data-delsec],[data-gi],[data-ity],[data-fse],[data-c],[data-sitem],#b-gh,#b-exp,#b-imp,#b-set');if(!t)return;
 const d=t.dataset;
 if(d.go){const el=$(d.go);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})}
 else if(d.up){upKind=d.up;upKey=st.r[1];$('fi').click()}
 else if(d.addsec){const k=st.r[1];const s=JSON.parse(JSON.stringify(getF(k,'sections')||[]));s.push({t:'새 섹션',b:''});edit(k,'sections',s);draw(true)}
 else if(d.delsec!==undefined){if(!confirm('이 섹션을 삭제할까요?'))return;const k=st.r[1];const s=JSON.parse(JSON.stringify(getF(k,'sections')||[]));s.splice(+d.delsec,1);edit(k,'sections',s);draw(true)}
 else if(d.gi!==undefined){st.gi=+d.gi;const y=scrollY;draw();scrollTo(0,y)}
 else if(d.fse!==undefined){st.fse=d.fse;const y=scrollY;draw();scrollTo(0,y)}
 else if(d.ity!==undefined){st.it=d.ity;const y=scrollY;draw();scrollTo(0,y)}
 else if(d.c){const o=t.textContent;const ok=()=>{t.textContent='복사됨';t.classList.add('done');setTimeout(()=>{t.textContent=o;t.classList.remove('done')},900)};(navigator.clipboard?navigator.clipboard.writeText(d.c).then(ok,()=>{}):Promise.reject()).catch(()=>{})}
 else if(d.sitem!==undefined){st.iq=d.sitem;st.it='전체';$('sr').classList.remove('on');$('sq').value='';if(location.hash==='#/items')draw()}
 else if(t.id==='b-gh')saveGH();
 else if(t.id==='b-exp')exportJSON();
 else if(t.id==='b-imp')$('imp').click();
 else if(t.id==='b-set'){const c=GH();$('g-repo').value=c.repo||'';$('g-br').value=c.branch||'';$('g-pre').value=c.prefix||'';$('g-tok').value=c.token||'';$('dlg').showModal()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='fq'){st.fq=t.value.trim();$('fb').innerHTML=fishRows();return}
 if(t.id==='iq'){st.iq=t.value.trim();$('itb').innerHTML=itemRows();return}
 if(t.dataset.f==='intro')edit(t.dataset.k,'intro',t.value);
 else if(t.dataset.sf){const k=t.dataset.k;const s=JSON.parse(JSON.stringify(getF(k,'sections')||[]));const i=+t.dataset.si;if(s[i]){s[i][t.dataset.sf]=t.value;edit(k,'sections',s)}}
});
$('g-x').onclick=()=>$('dlg').close();
$('g-ok').onclick=()=>{localStorage.setItem('sds-gh',JSON.stringify({repo:$('g-repo').value.trim(),branch:$('g-br').value.trim(),prefix:$('g-pre').value.trim(),token:$('g-tok').value.trim()}));$('dlg').close();toast('설정을 저장했어요.')};

/* ---------- 시작 ---------- */
draw();
(async()=>{
 await idb.open();
 const dr=await idb.get('draft');
 if(dr&&dr.npcs&&dr.imgs)U={npcs:dr.npcs,imgs:{portrait:dr.imgs.portrait||{},sprite:dr.imgs.sprite||{}}};
 try{const r=await fetch('wiki-data.json',{cache:'no-store'});if(r.ok){const j=await r.json();BASE={npcs:j.npcs||{},v:{portrait:(j.v&&j.v.portrait)||{},sprite:(j.v&&j.v.sprite)||{}}}}}catch(e){}
 draw();
})();
</script>
</body>
</html>
